<div class="music-view-wrapper">
  <div class="music-grid">
    <!-- Player Card Column -->
    <div class="music-player-column">
      <div class="player-card glass">
        <div class="album-art-container">
          <canvas id="player-visualizer"></canvas>
          <div class="art-placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 18V5l12-2v13" />
              <circle cx="6" cy="18" r="3" />
              <circle cx="18" cy="16" r="3" />
            </svg>
          </div>
        </div>
        <div class="track-info">
          <div class="track-name" id="track-name">Loading Station...</div>
          <div class="track-artist" id="track-artist">Ambient Protocol</div>
        </div>
        <div class="player-controls">
          <button class="ctrl-btn" id="btn-prev" title="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <polygon points="19 20 9 12 19 4 19 20" />
              <line x1="5" y1="19" x2="5" y2="5" />
            </svg>
          </button>
          <button class="ctrl-btn play-pause" id="btn-play-pause" title="Play/Pause">
            <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
            <svg id="pause-icon" class="hidden" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16" />
              <rect x="14" y="4" width="4" height="16" />
            </svg>
          </button>
          <button class="ctrl-btn" id="btn-next" title="Next">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 4 15 12 5 20 5 4" />
              <line x1="19" y1="5" x2="19" y2="19" />
            </svg>
          </button>
        </div>
        <div class="volume-container">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="vol-icon">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
          </svg>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
        </div>
      </div>
    </div>

    <!-- Playlist Column -->
    <div class="music-playlist-column glass">
      <div class="playlist-header">
        <h3>Playlist</h3>
      </div>
      <div class="playlist" id="playlist">
        <!-- Playlist items injected by JS -->
      </div>
    </div>
  </div>
</div>
