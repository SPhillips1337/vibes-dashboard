<div class="music-view-wrapper">
  <div class="music-header-tabs">
    <button class="music-tab-btn active" data-tab="library">My Library</button>
    <button class="music-tab-btn" data-tab="discovery">Discovery (iTunes)</button>
  </div>

  <div id="music-tab-library" class="music-tab-content">
    <div class="music-grid">
      <!-- Player Card Column -->
      <div class="music-player-column">
        <div class="player-card glass">
          <div class="album-art-container">
            <canvas id="player-visualizer"></canvas>
            <div class="art-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M9 18V5l12-2v13" />
                <circle cx="6" cy="18" r="3" />
                <circle cx="18" cy="16" r="3" />
              </svg>
            </div>
          </div>
          <div class="track-info">
            <div class="track-name" id="track-name">Loading Station...</div>
            <div class="track-artist" id="track-artist">Ambient Protocol</div>
          </div>
          <div class="player-controls">
            <button class="ctrl-btn secondary" id="btn-shuffle" title="Shuffle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 3 21 3 21 8" />
                <line x1="4" y1="20" x2="21" y2="3" />
                <polyline points="21 16 21 21 16 21" />
                <line x1="15" y1="15" x2="21" y2="21" />
                <line x1="4" y1="4" x2="9" y2="9" />
              </svg>
            </button>
            <button class="ctrl-btn" id="btn-prev" title="Previous">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <polygon points="19 20 9 12 19 4 19 20" />
                <line x1="5" y1="19" x2="5" y2="5" />
              </svg>
            </button>
            <button class="ctrl-btn play-pause" id="btn-play-pause" title="Play/Pause">
              <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3" />
              </svg>
              <svg id="pause-icon" class="hidden" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="4" width="4" height="16" />
                <rect x="14" y="4" width="4" height="16" />
              </svg>
            </button>
            <button class="ctrl-btn" id="btn-next" title="Next">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 4 15 12 5 20 5 4" />
                <line x1="19" y1="5" x2="19" y2="19" />
              </svg>
            </button>
            <button class="ctrl-btn secondary" id="btn-repeat" title="Repeat">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="17 1 21 5 17 9" />
                <path d="M3 11V9a4 4 0 0 1 4-4h14" />
                <polyline points="7 23 3 19 7 15" />
                <path d="M21 13v2a4 4 0 0 1-4 4H3" />
              </svg>
            </button>
          </div>
          <div class="volume-container">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="vol-icon">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
            </svg>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
          </div>
          <div class="library-actions">
            <button class="action-btn" id="btn-download-playlist">Download Default Playlist</button>
          </div>
        </div>
      </div>

      <!-- Playlist Column -->
      <div class="music-playlist-column glass">
        <div class="playlist-header">
          <h3>Playlist</h3>
        </div>
        <div class="playlist" id="playlist">
          <!-- Playlist items injected by JS -->
        </div>
      </div>
    </div>
  </div>

  <div id="music-tab-discovery" class="music-tab-content hidden">
    <div class="discovery-container glass">
      <div class="discovery-header">
        <h3>Music Discovery</h3>
        <p>Search and find new music from iTunes.</p>
        <div class="search-bar">
          <input type="text" id="music-search-input" placeholder="Search for tracks (e.g. lofi, cinematic)...">
          <button id="btn-music-search" class="action-btn">Search</button>
        </div>
      </div>
      <div class="discovery-results" id="discovery-results">
        <div class="empty-discovery">Enter a search term to find music.</div>
      </div>
    </div>
  </div>
</div>
